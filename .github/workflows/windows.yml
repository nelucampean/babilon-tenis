name: windows-build

on:
  # Only code/asset changes trigger a build — README-only pushes skip it.
  push:
    paths:
      - 'babilon-desktop/**'
      - 'babilon-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Cache cargo deps + incremental artifacts: first build is full
      # price (~15-25 min), later builds only recompile what changed.
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-build
      - name: Build (Windows exe)
        env:
          # Static CRT: the exe runs on stock Windows 10/11, no VS redist needed.
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release -p babilon-desktop
      - name: Stage package (exe + umpire MP3s)
        run: |
          mkdir package
          cp target/release/babilon-desktop.exe package/BabilonTennis.exe
          mkdir package/assets
          cp -r babilon-desktop/assets package/assets
          cp README.md package/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: BabilonTennis-windows-x86_64
          path: package/
