name: windows-build

on:
  # Only code/asset changes trigger a build — README-only pushes skip it.
  # Tags (v*) skip this job: they run the `release` workflow instead.
  push:
    tags-ignore:
      - 'v*'
    paths:
      - 'babilon-desktop/**'
      - 'babilon-core/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Cache cargo deps + incremental artifacts: first build is full
      # price (~15-25 min), later builds only recompile what changed.
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-build
      - name: Build (Windows exe)
        env:
          # Static CRT: the exe runs on stock Windows 10/11, no VS redist needed.
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo build --release -p babilon-desktop
      - name: Stage package (exe + assets)
        # NOTE: this runs in PowerShell — no Unix redirections (no 2>/dev/null)
        # and no `||` chains here.
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item target/release/babilon-desktop.exe package/BabilonTennis.exe
          Copy-Item babilon-desktop/assets package/assets -Recurse -Force
          if (Test-Path README.md) { Copy-Item README.md package/ }
      - uses: actions/upload-artifact@v4
        with:
          name: BabilonTennis-windows-x86_64
          path: package/
          # Fail the job instead of posting a warning if staging produced
          # nothing — a "successful" run with no downloadable artifact is
          # the failure mode this guards against.
          if-no-files-found: error
