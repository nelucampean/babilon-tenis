name: ci

# Fast feedback on Linux: formatting, lints (warnings are errors) and the
# full headless test suite. The Windows build/release workflows stay
# separate (see windows.yml / release.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-linux
      # rodio/cpal's alsa-sys links libasound; no libudev needed because
      # this workspace builds Bevy without bevy_gilrs.
      - name: System deps (ALSA)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
