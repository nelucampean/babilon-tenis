[package]
name = "babilon-core"
version = "0.5.0"
edition = "2021"
description = "Pure tennis rules + state machine ported from Babilon Tennis 0.5 (index.html). No UI deps — reused by desktop and later mobile."

[lib]
name = "babilon_core"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
